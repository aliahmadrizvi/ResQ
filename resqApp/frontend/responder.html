<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        #primary-nav-links.nav-collapsed { display: none; }
        @media (min-width: 768px) { #primary-nav-links.nav-collapsed { display: grid; } }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <nav class="w-full md:w-64 md:min-h-screen bg-slate-800 p-4 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col">
        <h1 class="text-2xl font-bold text-red-500 mb-3 md:mb-8 tracking-wide">🚨 ResQ</h1>
        <button id="nav-toggle" type="button" class="md:hidden mb-3 w-full flex items-center justify-between bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm font-medium" aria-controls="primary-nav-links" aria-expanded="true">
            <span>Menu</span><span aria-hidden="true">☰</span>
        </button>
        <ul id="primary-nav-links" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-1 gap-1 md:gap-2 flex-1">
            <li><a href="index.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base hover:bg-slate-700 rounded-lg text-slate-300 transition">🏠 Dashboard</a></li>
            <li id="nav-report"><a href="report.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base hover:bg-slate-700 rounded-lg text-slate-300 transition">🚨 Report Emergency</a></li>
            <li><a href="incidents.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base hover:bg-slate-700 rounded-lg text-slate-300 transition">📍 Active Incidents</a></li>
            <li id="nav-responder"><a href="responder.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base bg-slate-700 rounded-lg text-white font-medium text-red-400">👨‍🚒 Responder Panel</a></li>
            <li><a href="guide.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base hover:bg-slate-700 rounded-lg text-slate-300 transition">🧭 Emergency Guide</a></li>
            <li><a href="map.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base hover:bg-slate-700 rounded-lg text-slate-300 transition">🗺️ Live Map</a></li>
            <li><a href="nearby.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base hover:bg-slate-700 rounded-lg text-slate-300 transition">🏥 Nearby Help</a></li>
            <li id="nav-analytics"><a href="analytics.html" class="block p-2 md:p-3 text-xs sm:text-sm md:text-base hover:bg-slate-700 rounded-lg text-slate-300 transition">📊 Analytics</a></li>
        </ul>
        <button onclick="localStorage.removeItem('resq_role'); window.location.href='login.html'" class="mt-3 md:mt-8 bg-slate-700 hover:bg-red-600 text-white p-2 rounded w-full transition">Switch Role</button>
    </nav>

    <main class="flex-1 min-w-0 p-4 sm:p-6 md:p-10">
        <header class="mb-6 border-b border-slate-700 pb-4">
            <h2 class="text-2xl sm:text-3xl font-semibold">Responder Dashboard</h2>
            <p class="text-slate-400 mt-2">Manage, filter, and update active dispatch tasks.</p>
        </header>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="text" id="resp-search" placeholder="Search ID, Location, or type..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none transition">
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="applyRespFilter('All', this)" class="resp-filter-btn bg-blue-600 text-white border border-blue-500 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition">All</button>
                <button onclick="applyRespFilter('Responder Needed', this)" class="resp-filter-btn bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition">New</button>
                <button onclick="applyRespFilter('Responding', this)" class="resp-filter-btn bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition">Active</button>
                <button onclick="applyRespFilter('Critical', this)" class="resp-filter-btn bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition">Critical</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="incident-list"></div>
    </main>

    <script src="app.js"></script>
    <script>
        let currentRespFilter = 'All';
        let searchRespQuery = '';

        document.getElementById('resp-search').addEventListener('input', (e) => {
            searchRespQuery = e.target.value.toLowerCase();
            loadIncidents();
        });

        function applyRespFilter(filterName, btnElement) {
            currentRespFilter = filterName;
            document.querySelectorAll('.resp-filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
                btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
            });
            btnElement.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
            btnElement.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
            loadIncidents();
        }

        function loadIncidents() {
            const list = document.getElementById('incident-list');
            list.innerHTML = ''; 
            let incidents = getIncidents().filter(inc => {
                const searchTxt = searchRespQuery.toLowerCase();
                const matchesSearch = inc.location.toLowerCase().includes(searchTxt) || 
                                      inc.type.toLowerCase().includes(searchTxt) ||
                                      inc.id.toLowerCase().includes(searchTxt);
                let matchesFilter = true;
                if (currentRespFilter !== 'All') {
                    if (currentRespFilter === 'Critical') matchesFilter = inc.severity === 'Critical';
                    else if (currentRespFilter === 'Responder Needed' || currentRespFilter === 'Responding') matchesFilter = inc.status === currentRespFilter;
                }
                return matchesSearch && matchesFilter;
            });
            
            if (incidents.length === 0) {
                list.innerHTML = `<p class="text-slate-400">No active incidents matching criteria.</p>`;
                return;
            }

            incidents.forEach(inc => {
                let statusColor = 'text-red-400';
                let nextAction = `<button onclick="handleAction('${inc.id}', 'Responding')" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 py-2 rounded font-medium transition">Accept Incident</button>`;
                
                if (inc.status === 'Responding') {
                    statusColor = 'text-blue-400';
                    nextAction = `<button onclick="handleAction('${inc.id}', 'Arrived')" class="w-full mt-4 bg-yellow-600 hover:bg-yellow-700 py-2 rounded font-medium transition">Mark Arrived</button>`;
                } else if (inc.status === 'Arrived') {
                    statusColor = 'text-yellow-400';
                    nextAction = `<button onclick="handleAction('${inc.id}', 'Resolved')" class="w-full mt-4 bg-green-600 hover:bg-green-700 py-2 rounded font-medium transition">Mark Resolved</button>`;
                } else if (inc.status === 'Resolved') {
                    statusColor = 'text-green-400';
                    nextAction = `<button disabled class="w-full mt-4 bg-slate-700 text-slate-400 py-2 rounded font-medium cursor-not-allowed">Incident Closed</button>`;
                }

                const reporterInfo = inc.reporterName ? `<p class="text-xs text-slate-400 mt-2 border-t border-slate-700 pt-2">👤 ${inc.reporterName} | 📞 <a href="tel:${inc.reporterPhone}" class="text-blue-400 hover:underline">${inc.reporterPhone}</a></p>` : '';
                const hasPhotos = (inc.photos && inc.photos.length > 0) ? `<p class="text-xs text-blue-400 mt-1">📸 Evidence Attached</p>` : '';

                list.innerHTML += `
                    <div class="bg-slate-800 border ${inc.severity === 'Critical' && inc.status !== 'Resolved' ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-slate-700'} p-5 rounded-xl shadow-lg flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center gap-2">
                                    <h3 class="text-xl font-bold">${inc.type}</h3>
                                    <span class="bg-slate-900 border border-slate-600 text-[10px] px-2 py-1 rounded text-slate-400 font-mono">${inc.id}</span>
                                </div>
                                <span class="bg-slate-700 text-xs px-2 py-1 rounded">${inc.time}</span>
                            </div>
                            <p class="text-slate-300 text-sm mb-1"><span class="font-bold">📍 Loc:</span> ${inc.location}</p>
                            <p class="text-slate-300 text-sm mb-1"><span class="font-bold">⚠️ Sev:</span> ${inc.severity}</p>
                            ${hasPhotos}
                            ${reporterInfo}
                            <p class="text-sm mt-3 text-slate-400 bg-slate-900 p-2 rounded border border-slate-700">"${inc.description}"</p>
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-700">
                            <p class="text-sm font-bold ${statusColor}">Status: ${inc.status}</p>
                            ${nextAction}
                        </div>
                    </div>`;
            });
        }
        window.handleAction = function(id, newStatus) { updateStatus(id, newStatus); loadIncidents(); }
        document.addEventListener('DOMContentLoaded', loadIncidents);
    </script>
    <script type="module">
  import { db } from './firebase-config.js';
  // Ab aap yahan Firestore se data save ya read kar sakte hain!
</script>
</body>
</html>
