<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-start sm:items-center justify-center px-4 py-8 sm:p-6 relative overflow-x-hidden overflow-y-auto">
    <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black -z-10 pointer-events-none"></div>

    <div class="max-w-2xl w-full my-auto">
        <div class="text-center mb-8 sm:mb-12">
            <h1 class="text-5xl sm:text-6xl font-bold text-red-500 mb-3 sm:mb-4 tracking-wide">🚨 ResQ</h1>
            <p class="text-base sm:text-xl text-slate-400">Emergency Response &amp; Coordination Platform</p>
        </div>

        <div id="role-selection" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 transition-all duration-300">
            <button onclick="loginAsCitizen()" class="bg-slate-800 border border-slate-700 hover:border-blue-500 p-6 sm:p-8 rounded-xl transition group text-center shadow-lg hover:shadow-blue-900/20">
                <span class="text-5xl block mb-4 group-hover:scale-110 transition-transform">👤</span>
                <h2 class="text-2xl font-bold mb-2">Citizen Portal</h2>
                <p class="text-slate-400 text-sm">Report emergencies, find nearby help, and view guides.</p>
                <div class="mt-6 text-blue-400 text-sm font-medium">Open Access &rarr;</div>
            </button>

            <button onclick="showResponderLogin()" class="bg-slate-800 border border-slate-700 hover:border-red-500 p-6 sm:p-8 rounded-xl transition group text-center shadow-lg hover:shadow-red-900/20">
                <span class="text-5xl block mb-4 group-hover:scale-110 transition-transform">👨‍🚒</span>
                <h2 class="text-2xl font-bold mb-2">Responder Portal</h2>
                <p class="text-slate-400 text-sm">Receive prioritized reports, coordinate response, and update incident status.</p>
                <div class="mt-6 text-red-400 text-sm font-medium">Authorized Personnel Only 🔒</div>
            </button>
        </div>

        <div id="responder-login" class="hidden max-w-md mx-auto bg-slate-800 border border-slate-700 p-6 sm:p-8 rounded-xl shadow-2xl transition-all duration-300">
            <div class="flex items-center justify-between gap-3 mb-6">
                <h2 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2"><span>🔒</span> Authority Login</h2>
                <button onclick="hideResponderLogin()" class="text-slate-400 hover:text-white transition shrink-0">✖ Close</button>
            </div>
            <p class="text-sm text-slate-400 mb-6 border-b border-slate-700 pb-4">Please enter your official ResQ Responder ID and password.</p>
            <form id="auth-form" class="space-y-5">
                <div>
                    <label class="block text-slate-300 text-sm mb-2 font-medium">Responder ID</label>
                    <input type="text" id="username" placeholder="e.g. RESQ-01" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required>
                </div>
                <div>
                    <label class="block text-slate-300 text-sm mb-2 font-medium">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required>
                </div>
                <div id="login-error" class="hidden bg-red-900/40 border border-red-500 text-red-400 text-sm p-3 rounded-lg text-center font-medium">
                    Invalid ID or Password. Access Denied.
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-lg transition mt-4">Authenticate</button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-500">Hint: ID = <span class="text-slate-300">admin</span> | Pass = <span class="text-slate-300">admin123</span></div>
        </div>
        <footer class="mt-8 text-center text-xs text-slate-500">© 2026 4bitDeveloper · ResQ Emergency Response</footer>
    </div>

    <script>
        function loginAsCitizen() {
            localStorage.setItem('resq_role', 'citizen');
            window.location.href = 'index.html'; 
        }
        function showResponderLogin() {
            document.getElementById('role-selection').classList.add('hidden');
            document.getElementById('responder-login').classList.remove('hidden');
        }
        function hideResponderLogin() {
            document.getElementById('responder-login').classList.add('hidden');
            document.getElementById('role-selection').classList.remove('hidden');
        }
        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('resq_role', 'responder');
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = 'Verifying... ✅';
                btn.classList.replace('bg-red-600', 'bg-green-600');
                setTimeout(() => window.location.href = 'responder.html', 800);
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });
    </script>
    <script type="module">
  import { db } from './firebase-config.js';
  
</script>
</body>
</html>
