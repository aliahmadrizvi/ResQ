<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ - Report Emergency</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col md:flex-row">

    <nav class="w-full md:w-64 bg-slate-800 p-4 border-r border-slate-700 flex flex-col">
        <h1 class="text-2xl font-bold text-red-500 mb-8 tracking-wide">🚨 ResQ</h1>
        <ul class="space-y-2 flex-1">
            <li><a href="index.html" class="block p-3 hover:bg-slate-700 rounded-lg text-slate-300 transition">🏠 Dashboard</a></li>
            <li id="nav-report"><a href="report.html" class="block p-3 bg-slate-700 rounded-lg text-white font-medium">🚨 Report Emergency</a></li>
            <li><a href="incidents.html" class="block p-3 hover:bg-slate-700 rounded-lg text-slate-300 transition">📍 Active Incidents</a></li>
            <li id="nav-responder"><a href="responder.html" class="block p-3 hover:bg-slate-700 rounded-lg text-slate-300 transition text-red-400">👨‍🚒 Responder Panel</a></li>
            <li><a href="guide.html" class="block p-3 hover:bg-slate-700 rounded-lg text-slate-300 transition">🧭 Emergency Guide</a></li>
            <li><a href="map.html" class="block p-3 hover:bg-slate-700 rounded-lg text-slate-300 transition">🗺️ Live Map</a></li>
            <li><a href="nearby.html" class="block p-3 hover:bg-slate-700 rounded-lg text-slate-300 transition">🏥 Nearby Help</a></li>
            <li id="nav-analytics"><a href="analytics.html" class="block p-3 hover:bg-slate-700 rounded-lg text-slate-300 transition">📊 Analytics</a></li>
        </ul>
        <button onclick="localStorage.removeItem('resq_role'); window.location.href='login.html'" class="mt-8 bg-slate-700 hover:bg-red-600 text-white p-2 rounded w-full transition">Switch Role</button>
    </nav>

    <main class="flex-1 p-6 md:p-10">
        <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-3xl font-bold mb-6 text-red-500">Report an Emergency</h2>
            
            <form id="report-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-300 mb-2 text-sm font-medium">Your Name</label>
                        <input type="text" id="reporter-name" placeholder="Enter full name" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required>
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-2 text-sm font-medium">Phone Number</label>
                        <input type="tel" id="reporter-phone" placeholder="e.g. +91 9876543210" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-300 mb-2 text-sm font-medium">Emergency Type</label>
                        <select id="type" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-500 outline-none" required>
                            <option value="🚗 Accident">🚗 Accident</option>
                            <option value="🔥 Fire">🔥 Fire</option>
                            <option value="🏥 Medical">🏥 Medical</option>
                            <option value="🌊 Flood">🌊 Flood</option>
                            <option value="🚧 Road Block">🚧 Road Block</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-2 text-sm font-medium">Severity</label>
                        <select id="severity" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-500 outline-none">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-300 mb-2 text-sm font-medium">Location</label>
                    <div class="flex gap-2">
                        <input type="text" id="location" placeholder="e.g. Main Gate" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required>
                        <button type="button" onclick="getLocation()" class="bg-slate-700 hover:bg-slate-600 px-4 rounded-lg whitespace-nowrap text-sm font-medium transition">📍 GPS</button>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-300 mb-2 text-sm font-medium">Description</label>
                    <textarea id="description" rows="3" placeholder="What exactly happened?" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required></textarea>
                </div>

                <div>
                    <label class="block text-slate-300 mb-2 text-sm font-medium">Upload Evidence (Max 2 Photos)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="file" id="photo1" accept="image/*" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white">
                        <input type="file" id="photo2" accept="image/*" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-lg shadow-lg transition text-lg">🚨 Submit Emergency</button>
            </form>
            
            <div id="success-message" class="hidden mt-6 bg-green-900/50 border border-green-500 text-green-300 p-4 rounded-lg text-center font-medium">
                Emergency reported! Ref ID: <span id="generated-id" class="font-bold text-white"></span>. Redirecting...
            </div>
        </div>
    </main>

    <script src="app.js"></script>
   <script>
    document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Processing Evidence... ⏳";
            submitBtn.disabled = true;
            submitBtn.classList.replace('bg-red-600', 'bg-slate-600');

            try {
                const file1 = document.getElementById('photo1').files[0];
                const file2 = document.getElementById('photo2').files[0];
                const photo1Base64 = await getBase64(file1);
                const photo2Base64 = await getBase64(file2);
                
                const photosArray = [];
                if (photo1Base64) photosArray.push(photo1Base64);
                if (photo2Base64) photosArray.push(photo2Base64);
                
                const uniqueId = 'RESQ-' + Math.floor(1000 + Math.random() * 9000);
                
                const newIncident = {
                    id: uniqueId,
                    type: document.getElementById('type').value,
                    location: document.getElementById('location').value,
                    time: 'Just now',
                    severity: document.getElementById('severity').value,
                    status: 'Responder Needed',
                    description: document.getElementById('description').value,
                    reporterName: document.getElementById('reporter-name').value,
                    reporterPhone: document.getElementById('reporter-phone').value,
                    photos: photosArray 
                };

                // TRY TO SAVE IT
                addIncident(newIncident);
                
                // IF SUCCESSFUL:
                document.getElementById('report-form').reset();
                document.getElementById('generated-id').innerText = uniqueId;
                document.getElementById('success-message').classList.remove('hidden');
                setTimeout(() => window.location.href = 'incidents.html', 2000);

            } catch (error) {
                // IF STORAGE IS FULL (QuotaExceededError), DO THIS INSTEAD:
                alert("❌ Storage Full! The photos are too large for the browser's temporary database. Please click 'Reset System Data' in the sidebar.");
                
                // Reset the button so they can try again
                submitBtn.innerText = "🚨 Submit Emergency";
                submitBtn.disabled = false;
                submitBtn.classList.replace('bg-slate-600', 'bg-red-600');
            }
        });
   </script>
</body>
</html>
