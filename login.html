<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ - Select Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background styling for tech feel -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black -z-10"></div>

    <div class="max-w-2xl w-full">
        <div class="text-center mb-12">
            <h1 class="text-6xl font-bold text-red-500 mb-4 tracking-wide">🚨 ResQ</h1>
            <p class="text-xl text-slate-400">Emergency Response & Coordination Platform</p>
        </div>

        <!-- VIEW 1: Role Selection -->
        <div id="role-selection" class="grid grid-cols-1 md:grid-cols-2 gap-6 transition-all duration-300">
            <!-- Citizen Portal Button -->
            <button onclick="loginAsCitizen()" class="bg-slate-800 border border-slate-700 hover:border-blue-500 p-8 rounded-xl transition group text-center shadow-lg hover:shadow-blue-900/20">
                <span class="text-5xl block mb-4 group-hover:scale-110 transition-transform">👤</span>
                <h2 class="text-2xl font-bold mb-2">Citizen Portal</h2>
                <p class="text-slate-400 text-sm">Report emergencies, find nearby help, and view guides.</p>
                <div class="mt-6 text-blue-400 text-sm font-medium">Open Access &rarr;</div>
            </button>

            <!-- Responder Portal Button -->
            <button onclick="showResponderLogin()" class="bg-slate-800 border border-slate-700 hover:border-red-500 p-8 rounded-xl transition group text-center shadow-lg hover:shadow-red-900/20">
                <span class="text-5xl block mb-4 group-hover:scale-110 transition-transform">👨‍🚒</span>
                <h2 class="text-2xl font-bold mb-2">Responder Portal</h2>
                <p class="text-slate-400 text-sm">Manage active incidents, update status, and view analytics.</p>
                <div class="mt-6 text-red-400 text-sm font-medium">Authorized Personnel Only 🔒</div>
            </button>
        </div>

        <!-- VIEW 2: Responder Login Form (Hidden by default) -->
        <div id="responder-login" class="hidden max-w-md mx-auto bg-slate-800 border border-slate-700 p-8 rounded-xl shadow-2xl transition-all duration-300">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span>🔒</span> Authority Login
                </h2>
                <button onclick="hideResponderLogin()" class="text-slate-400 hover:text-white transition">✖ Close</button>
            </div>
            
            <p class="text-sm text-slate-400 mb-6 border-b border-slate-700 pb-4">Please enter your official ResQ Responder ID and password to access the dispatch system.</p>

            <form id="auth-form" class="space-y-5">
                <div>
                    <label class="block text-slate-300 text-sm mb-2 font-medium">Responder ID</label>
                    <input type="text" id="username" placeholder="e.g. RESQ-01" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required>
                </div>
                
                <div>
                    <label class="block text-slate-300 text-sm mb-2 font-medium">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none focus:ring-2 focus:ring-red-500" required>
                </div>

                <!-- Error Message Container -->
                <div id="login-error" class="hidden bg-red-900/40 border border-red-500 text-red-400 text-sm p-3 rounded-lg text-center font-medium">
                    Invalid ID or Password. Access Denied.
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-lg transition mt-4">
                    Authenticate
                </button>
            </form>
            
            <!-- Demo hint for the hackathon -->
            <div class="mt-6 text-center text-xs text-slate-500">
                Hackathon Demo Hint: ID = <span class="text-slate-300">admin</span> | Pass = <span class="text-slate-300">admin123</span>
            </div>
        </div>
    </div>

    <script>
        const roleSelection = document.getElementById('role-selection');
        const responderLogin = document.getElementById('responder-login');
        const errorMsg = document.getElementById('login-error');

        function loginAsCitizen() {
            localStorage.setItem('resq_role', 'citizen');
            window.location.href = 'index.html'; 
        }

        function showResponderLogin() {
            roleSelection.classList.add('hidden');
            responderLogin.classList.remove('hidden');
            errorMsg.classList.add('hidden'); // reset error message
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function hideResponderLogin() {
            responderLogin.classList.add('hidden');
            roleSelection.classList.remove('hidden');
        }

        // Handle the login attempt
        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page refresh
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // HARDCODED DEMO CREDENTIALS
            if (user === 'admin' && pass === 'admin123') {
                // Success! Set role and redirect
                localStorage.setItem('resq_role', 'responder');
                
                // Show a quick success state before redirecting
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = 'Verifying... ✅';
                btn.classList.replace('bg-red-600', 'bg-green-600');
                btn.classList.replace('hover:bg-red-700', 'hover:bg-green-700');

                setTimeout(() => {
                    window.location.href = 'responder.html';
                }, 800);
            } else {
                // Failed! Show error
                errorMsg.classList.remove('hidden');
                // Add a small shake animation class if you want, or just let the text show
            }
        });
    </script>
</body>
</html>
